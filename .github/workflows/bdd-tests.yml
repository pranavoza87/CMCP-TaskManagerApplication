name: BDD tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bdd-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bdd-test-reports
          path: |
            tests/Test Execution & Reporting/html-report
            tests/Test Execution & Reporting/junit.xml
            tests/Test Execution & Reporting/results.json
            tests/Test Execution & Reporting/test-results
          if-no-files-found: warn
          retention-days: 14
